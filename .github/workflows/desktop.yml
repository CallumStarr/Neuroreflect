# Builds the Windows installer on GitHub's machines. Push a version tag such as
# v0.1.0, or run it by hand from the Actions tab, and it attaches the installer to
# a draft release. Code signing is not set up yet: see "Desktop app" in README.md.
name: Desktop build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'NeuroReflect v__VERSION__'
          releaseBody: 'Download the setup file below to install NeuroReflect on Windows.'
          releaseDraft: true
          prerelease: false
